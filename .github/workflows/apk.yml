name: apk

on:
  workflow_dispatch:
    inputs:
      build:
        description: "Which APK to build"
        type: choice
        default: debug
        options: [debug, release]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JBR
        uses: actions/setup-java@v4
        with:
          distribution: "jetbrains"
          java-package: "jdk"
          java-version: "25"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble APK
        run: |
          if [ "${{ inputs.build }}" = "release" ]; then
            ./gradlew :android:app:assembleRelease --no-daemon
          else
            ./gradlew :android:app:assembleDebug --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: grabbit-${{ inputs.build }}-apk
          path: android/app/build/outputs/apk/${{ inputs.build }}/*.apk
