name: apk

on:
  workflow_dispatch:
    inputs:
      build:
        description: "Which APK to build"
        type: choice
        default: debug
        options: [debug, release]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JBR
        uses: actions/setup-java@v4
        with:
          distribution: "jetbrains"
          java-package: "jdk"
          java-version: "25"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble APK
        run: |
          if [ "${{ inputs.build }}" = "release" ]; then
            ./gradlew :android:app:assembleRelease --no-daemon
          else
            ./gradlew :android:app:assembleDebug --no-daemon
          fi

      - name: Sign release APKs
        if: inputs.build == 'release'
        env:
          KEYSTORE_B64: ${{ secrets.ABDM_KEYSTORE_FILE }}
          KEYSTORE_PASS: ${{ secrets.ABDM_KEYSTORE_FILE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ABDM_KEYSTORE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ABDM_KEYSTORE_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > /tmp/grabbit.jks
          APKSIGNER=$(echo $ANDROID_HOME/build-tools/*/apksigner | tr ' ' '\n' | sort -V | tail -1)
          for apk in android/app/build/outputs/apk/release/*.apk; do
            case "$apk" in *-signed.apk) continue;; esac
            "$APKSIGNER" sign --ks /tmp/grabbit.jks \
              --ks-pass env:KEYSTORE_PASS --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS \
              --out "${apk%.apk}-signed.apk" "$apk"
          done
          rm -f /tmp/grabbit.jks

      - name: Verify signatures
        if: inputs.build == 'release'
        run: |
          APKSIGNER=$(echo $ANDROID_HOME/build-tools/*/apksigner | tr ' ' '\n' | sort -V | tail -1)
          for apk in android/app/build/outputs/apk/release/*-signed.apk; do
            "$APKSIGNER" verify --print-certs "$apk" | head -n 4
            sha256sum "$apk" | awk '{print $1}' > "$apk.sha256"
          done
          rm -f android/app/build/outputs/apk/release/*-unsigned.apk

      - name: Upload debug APK
        if: inputs.build == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: grabbit-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload signed arm64 APK
        if: inputs.build == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: grabbit-release-arm64
          path: |
            android/app/build/outputs/apk/release/*-arm64-*-signed.apk
            android/app/build/outputs/apk/release/*-arm64-*-signed.apk.sha256

      - name: Upload signed v7a APK
        if: inputs.build == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: grabbit-release-v7a
          path: |
            android/app/build/outputs/apk/release/*-armeabi-*-signed.apk
            android/app/build/outputs/apk/release/*-armeabi-*-signed.apk.sha256

      - name: Upload signed x86_64 APK
        if: inputs.build == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: grabbit-release-x86_64
          path: |
            android/app/build/outputs/apk/release/*-x86_64-*-signed.apk
            android/app/build/outputs/apk/release/*-x86_64-*-signed.apk.sha256
