name: test

on:
  push:
  pull_request:

jobs:
  shared-utils-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JBR
        uses: actions/setup-java@v4
        with:
          distribution: "jetbrains"
          java-package: "jdk"
          java-version: "25"
          check-latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run shared:utils JVM tests
        run: ./gradlew :shared:utils:desktopTest :downloader:core:desktopTest --no-daemon

      - name: Compile Android app
        run: ./gradlew :android:app:compileDebugKotlin --no-daemon
